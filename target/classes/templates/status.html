<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Support Ticket Management - Check Status</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <header>
        <h1>Support Ticket Management System</h1>
        <nav>
            <a href="/">Submit Ticket</a>
            <a href="/status">Check Status</a>
            <a href="/admin">Admin Dashboard</a>
        </nav>
    </header>

    <main class="container">
        <h2>Check Ticket Status</h2>

        <div th:if="${error}" class="alert error">
            <p th:text="${error}"></p>
        </div>

        <form action="/status" method="POST" class="search-form">
            <div class="form-group">
                <label for="ticketId">Enter Ticket ID:</label>
                <input type="text" id="ticketId" name="ticketId" required placeholder="e.g. TKT1001">
                <button type="submit" class="btn primary">View Status</button>
            </div>
        </form>

        <div th:if="${ticket != null}" class="ticket-details card">
            <h3>Ticket Information</h3>
            <p><strong>Ticket ID:</strong> <span th:text="${ticket.ticketId}"></span></p>
            <p><strong>Customer Name:</strong> <span th:text="${ticket.customerName}"></span></p>
            <p><strong>Status:</strong> <span class="badge" th:text="${ticket.status}"></span></p>
            
            <div class="description-box">
                <strong>Description:</strong>
                <p th:text="${ticket.description}"></p>
            </div>
        </div>
    </main>
</body>
</html>
