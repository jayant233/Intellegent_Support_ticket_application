<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Support Tickets</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
        <nav>
            <a href="/">Submit Ticket</a>
            <a href="/status">Check Status</a>
            <a href="/admin">Admin Dashboard</a>
        </nav>
    </header>

    <main class="container-full">
        <h2>Manage Support Tickets</h2>
        
        <div class="filters-section card">
            <form action="/admin" method="GET" class="filter-form">
                <div class="filter-group">
                    <label for="searchId">Search by ID:</label>
                    <input type="text" id="searchId" name="searchId" placeholder="TKT1001">
                </div>
                
                <div class="filter-group">
                    <label for="severity">Severity:</label>
                    <select id="severity" name="severity">
                        <option value="">All</option>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="priority">Priority:</label>
                    <select id="priority" name="priority">
                        <option value="">All</option>
                        <option value="P1">P1</option>
                        <option value="P2">P2</option>
                        <option value="P3">P3</option>
                        <option value="P4">P4</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="status">Status:</label>
                    <select id="status" name="status">
                        <option value="">All</option>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="On Hold">On Hold</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                
                <div class="filter-actions">
                    <button type="submit" class="btn primary">Apply Filters</button>
                    <a href="/admin" class="btn secondary">Clear</a>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Customer</th>
                        <th>Category</th>
                        <th>Severity</th>
                        <th>Priority</th>
                        <th>SLA (Hours)</th>
                        <th>Current Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${tickets.empty}">
                        <td colspan="8" class="text-center">No tickets found.</td>
                    </tr>
                    <tr th:each="ticket : ${tickets}">
                        <td th:text="${ticket.ticketId}"></td>
                        <td th:text="${ticket.customerName}"></td>
                        <td th:text="${ticket.category}"></td>
                        <td th:text="${ticket.severity}"></td>
                        <td th:text="${ticket.priority}"></td>
                        <td th:text="${ticket.slaHours}"></td>
                        <td th:text="${ticket.status}"></td>
                        <td>
                            <form action="/admin/update-status" method="POST" class="inline-form">
                                <input type="hidden" name="ticketId" th:value="${ticket.ticketId}">
                                <select name="status" class="status-select">
                                    <option value="Open" th:selected="${ticket.status == 'Open'}">Open</option>
                                    <option value="In Progress" th:selected="${ticket.status == 'In Progress'}">In Progress</option>
                                    <option value="On Hold" th:selected="${ticket.status == 'On Hold'}">On Hold</option>
                                    <option value="Closed" th:selected="${ticket.status == 'Closed'}">Closed</option>
                                </select>
                                <button type="submit" class="btn small">Update</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
