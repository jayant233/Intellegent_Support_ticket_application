spring.application.name=Support Ticket Management

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/support_ticket_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically run schema.sql and data.sql on startup
spring.sql.init.mode=always

# Thymeleaf configuration (disable caching for development)
spring.thymeleaf.cache=false

# Port configuration
server.port=8080
